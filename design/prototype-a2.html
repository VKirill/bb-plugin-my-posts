<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyPosts · A2 · Студия: пост + чат</title>
<style>
/*
 * MyPosts prototype kit. Host emulation (BB + Pokecut theme tokens) and the
 * Pokecut plugin classes from docs/design/pokecut-plugin.css with the mp- prefix.
 * In the real plugin the host block below is NOT shipped: BB provides it.
 */

/* ---------- 1. Host emulation: BB tokens as the Pokecut theme sets them ---------- */
:root {
  --canvas: #fafafa; --ink: #393846; --foreground: var(--ink); --background: var(--canvas);
  --primary: #9b4d8f; --primary-foreground: #ffffff;
  --card: #ffffff; --popover: #ffffff; --muted: #ebebeb; --muted-foreground: #5e5e5e;
  --timeline-accent: #3e7be8; --destructive: #d93a2b; --destructive-text: #c2412d;
  --warning: #f08c1a; --warning-text: #b4540f; --success: #3fae4a; --diff-added: #2f8a45;
  --border: #d6d6d6; --input: #cfcfcf; --ring: color-mix(in oklab, var(--primary) 70%, var(--canvas));
  --state-hover: color-mix(in oklab, var(--ink) 5%, transparent);
  --surface-selected: color-mix(in oklab, var(--primary) 12%, transparent);
  --shadow-lg: 0 14px 28px -8px rgb(0 0 0 / 0.14);
  --pk-shell: #ededed; --pk-panel: var(--canvas); --pk-card: #ffffff; --pk-well: #f5f5f5;
  --pk-outline: #cfcfcf; --pk-hairline: #eaeceb;
  --pk-drop: 0 8px 16px -4px #dedede; --pk-card-drop: 0 18px 20px -24px #dedede;
  --pk-accent-gradient:
    radial-gradient(80% 130% at 27% 16%, rgb(240 168 192 / 0.8) 0%, rgb(240 168 192 / 0) 58%),
    linear-gradient(101deg, #d96d98 0%, #d27aa2 38%, #aa79bf 71%, #8c69c3 100%);
  --pk-accent-edge: inset 0 -4.5px 1px -4px rgb(255 255 255 / 0.3);
  color-scheme: light;
}
:root.dark {
  --canvas: #16181d; --ink: #dcdde2; --primary: #d88bc4; --primary-foreground: #16181d;
  --card: #1b1e24; --popover: #1f232a; --muted: #262a32; --muted-foreground: #9b9ea6;
  --timeline-accent: #6b9bf5; --destructive: #e5534b; --destructive-text: #f08a80;
  --warning: #f0a040; --warning-text: #f2b46a; --success: #57c46a; --diff-added: #57c46a;
  --border: #3a3f49; --input: #3a3f49;
  --state-hover: color-mix(in oklab, var(--ink) 6%, transparent);
  --surface-selected: color-mix(in oklab, var(--primary) 14%, transparent);
  --shadow-lg: 0 14px 28px -8px rgb(0 0 0 / 0.6);
  --pk-shell: #0e1014; --pk-card: #1b1e24; --pk-well: #1f232a; --pk-outline: #3a3f49; --pk-hairline: #282d35;
  --pk-drop: 0 8px 16px -4px rgb(0 0 0 / 0.5); --pk-card-drop: 0 18px 20px -24px rgb(0 0 0 / 0.55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  display: flex; flex-direction: column; height: 100vh; min-height: 640px;
  background: var(--pk-shell); color: var(--foreground);
  font: 14px/1.45 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
svg.ico { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.ico-14 svg.ico, svg.ico.s14 { width: 14px; height: 14px; }
.ico-20 svg.ico { width: 20px; height: 20px; }

/* ---------- 2. Prototype chrome (not part of the plugin) ---------- */
.proto-bar {
  position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: nowrap; overflow-x: auto; white-space: nowrap; flex-shrink: 0; scrollbar-width: thin; align-items: center; gap: 8px;
  padding: 8px 16px; border-bottom: 1px dashed var(--pk-outline); background: var(--pk-shell); font-size: 12px;
}
.proto-bar .proto-name { font-weight: 600; margin-right: 8px; }
.proto-bar .proto-group { display: inline-flex; align-items: center; gap: 4px; }
.proto-bar .proto-label { color: var(--muted-foreground); margin-right: 2px; }
.proto-bar .proto-sep { flex: 1; }
.proto-bar button { height: 26px; padding: 0 8px; border-radius: 6px; }
.proto-warn { color: var(--destructive-text); font-weight: 600; }
.proto-note { color: var(--muted-foreground); }

/* BB window: a collapsed BB sidebar stub + the workspace pane that hosts the plugin. */
.bb-shell { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 12px; }
.bb-side { width: 44px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 8px; color: var(--muted-foreground); }
.bb-side span { width: 28px; height: 28px; border-radius: 8px; background: color-mix(in oklab, var(--foreground) 7%, transparent); }
.bb-side span.on { background: var(--pk-card); box-shadow: inset 0 0 0 1px var(--pk-outline); }
.bb-pane {
  flex: 1; min-width: 0; display: flex; flex-direction: column; margin: 0 auto;
  border: 1px solid var(--pk-hairline); border-radius: 20px; background: var(--pk-panel); box-shadow: var(--pk-drop); overflow: hidden;
}
.bb-pane[data-w="1200"] { flex: 0 1 1200px; }
.bb-pane[data-w="900"] { flex: 0 1 900px; }
.bb-pane[data-w="420"] { flex: 0 1 420px; }
.bb-pane-head { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-bottom: 1px solid var(--pk-hairline); font-size: 13px; font-weight: 500; flex-shrink: 0; }
.bb-pane-head .bb-dot { width: 18px; height: 18px; border-radius: 6px; background-image: var(--pk-accent-gradient); }
.bb-pane-head .bb-crumb { color: var(--muted-foreground); font-weight: 400; }

/* ---------- 3. Plugin root: tokens (Pokecut with BB fallbacks) + spacing scale ---------- */
.mp-app {
  --mp-well: var(--pk-well, color-mix(in oklab, var(--muted) 45%, var(--card)));
  --mp-card: var(--pk-card, var(--card));
  --mp-outline: var(--pk-outline, var(--input));
  --mp-hairline: var(--pk-hairline, var(--border));
  --mp-drop: var(--pk-drop, 0 1px 2px rgb(0 0 0 / 0.06));
  --mp-card-drop: var(--pk-card-drop, none);
  --mp-raise: 0 1px 3px 0 rgb(0 0 0 / 0.12);
  --mp-accent: var(--pk-accent-gradient, linear-gradient(var(--primary), var(--primary)));
  --mp-accent-edge: var(--pk-accent-edge, none);
  --mp-success: var(--success, #3fae4a);
  --mp-success-text: var(--diff-added, #2f8a45);
  --mp-info: var(--timeline-accent, #3e7be8);
  --mp-warning: var(--warning, #e8a33d);
  --mp-warning-text: var(--warning-text, #b4540f);
  --mp-danger-text: var(--destructive-text, var(--destructive));
  /* Spacing: concrete px, never var(--spacing) (BB Tailwind v4 = 4px). */
  --mp-s1: 4px; --mp-s2: 8px; --mp-s3: 12px; --mp-gap: 16px; --mp-card-pad: 20px; --mp-page-pad: 24px;
  container-type: inline-size; container-name: mp;
  position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column;
}
.mp-layout { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* Surfaces */
.mp-panel { min-width: 0; max-width: 100%; padding: 4px; border: 1px solid var(--mp-hairline); border-radius: 16px; background: var(--mp-well); box-shadow: var(--mp-card-drop); }
.mp-panel-head { display: flex; min-width: 0; align-items: center; gap: 8px; padding: 8px 10px; font-size: 13px; font-weight: 500; }
.mp-panel-body { min-width: 0; max-width: 100%; padding: 12px; border: 1px solid var(--mp-hairline); border-radius: 12px; background: var(--mp-card); box-shadow: var(--mp-drop); }
.mp-card { min-width: 0; border: 1px solid var(--mp-hairline); border-radius: 14px; background: var(--mp-card); box-shadow: var(--mp-drop); }
.mp-strip { min-width: 0; padding: 10px 14px; border: 1px solid var(--mp-hairline); border-radius: 14px; background: var(--mp-well); }
.mp-raised { border: 1px solid var(--mp-outline); background: var(--mp-card); box-shadow: var(--mp-drop); }
.mp-tile { display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center; width: 28px; height: 28px; border: 1px solid var(--mp-outline); border-radius: 9px; background: var(--mp-card); box-shadow: var(--mp-drop); }
.mp-tile.lg { width: 40px; height: 40px; border-radius: 12px; }
.mp-tile.sm { width: 22px; height: 22px; border-radius: 7px; }
.mp-tile.sm svg.ico { width: 13px; height: 13px; }

/* Buttons */
.mp-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 500; white-space: nowrap; border: 1px solid transparent; }
.mp-btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
.mp-btn.icon { width: 32px; padding: 0; }
.mp-btn.sm.icon { width: 28px; }
.mp-btn.ghost:hover { background: var(--state-hover); }
.mp-btn.mp-raised:hover { background: color-mix(in oklab, var(--mp-card) 92%, var(--foreground)); }
.mp-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.mp-accent { border-color: transparent; background-color: var(--primary); background-image: var(--mp-accent); box-shadow: var(--mp-accent-edge); color: #ffffff; }
.mp-accent:hover:not(:disabled) { filter: brightness(1.05) saturate(1.05); }

/* Segmented control and navigation rows */
.mp-seg { display: inline-flex; max-width: 100%; align-items: center; gap: 2px; padding: 3px; border: 1px solid var(--mp-hairline); border-radius: 9px; background: var(--mp-well); overflow-x: auto; scrollbar-width: none; }
.mp-seg-item { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 6px; color: var(--muted-foreground); font-size: 12px; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
.mp-seg-item:hover { color: var(--foreground); }
.mp-seg-item:is([data-state="active"], [aria-pressed="true"], [aria-selected="true"]) { background: var(--mp-card); box-shadow: var(--mp-raise); color: var(--foreground); font-weight: 600; }
.mp-nav-item { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 32px; padding: 0 8px; border-radius: 8px; color: var(--muted-foreground); text-align: left; }
.mp-nav-item:hover { color: var(--foreground); background: var(--state-hover); }
.mp-nav-item:is([aria-selected="true"], [aria-current="page"]) { background: var(--mp-card); box-shadow: inset 0 0 0 1px var(--mp-outline), var(--mp-drop); color: var(--foreground); }

/* Status pills */
.mp-pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 9999px; font-size: 12px; font-weight: 500; white-space: nowrap; line-height: 16px; }
.mp-pill-success { background: color-mix(in oklab, var(--mp-success) 14%, transparent); color: var(--mp-success-text); }
.mp-pill-info { background: color-mix(in oklab, var(--mp-info) 13%, transparent); color: var(--mp-info); }
.mp-pill-warning { background: color-mix(in oklab, var(--mp-warning) 16%, transparent); color: var(--mp-warning-text); }
.mp-pill-danger { background: color-mix(in oklab, var(--destructive) 12%, transparent); color: var(--mp-danger-text); }
.mp-pill-neutral { background: var(--mp-card); box-shadow: inset 0 0 0 1px var(--mp-outline); color: var(--foreground); }
.mp-pill-muted { background: color-mix(in oklab, var(--foreground) 7%, transparent); color: var(--foreground); }
.mp-text-success { color: var(--mp-success-text); }
.mp-text-warning { color: var(--mp-warning-text); }
.mp-text-danger { color: var(--mp-danger-text); }
.mp-help { display: inline-flex; width: 14px; height: 14px; margin-left: 4px; align-items: center; justify-content: center; vertical-align: top; border: 1px solid var(--mp-outline); border-radius: 9999px; background: var(--mp-card); color: var(--muted-foreground); font-size: 9px; font-weight: 600; line-height: 1; }

/* Text helpers */
.mp-h1 { margin: 0; font-size: 20px; font-weight: 500; line-height: 28px; }
.mp-h2 { margin: 0; font-size: 14px; font-weight: 500; }
.mp-meta { font-size: 12px; color: var(--muted-foreground); }
.mp-mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
.mp-num { font-variant-numeric: tabular-nums; }
.mp-truncate { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mp-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.mp-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.mp-grow { flex: 1; min-width: 0; }
.mp-divider { height: 1px; background: var(--mp-hairline); border: 0; margin: 0; }
.mp-scroll { overflow-y: auto; min-height: 0; }
.mp-avatar { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 9999px; flex-shrink: 0; font-size: 11px; font-weight: 600; color: var(--foreground); background: color-mix(in oklab, var(--primary) 16%, var(--mp-card)); box-shadow: inset 0 0 0 1px var(--mp-outline); }
.mp-avatar.lg { width: 40px; height: 40px; font-size: 14px; }
.mp-avatar.alt { background: color-mix(in oklab, var(--mp-info) 16%, var(--mp-card)); }
.mp-avatar.alt2 { background: color-mix(in oklab, var(--mp-warning) 18%, var(--mp-card)); }
.mp-kbd { font-size: 11px; padding: 0 4px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--mp-outline); color: var(--muted-foreground); }

/* Inputs */
.mp-input { height: 32px; width: 100%; padding: 0 10px; border-radius: 8px; border: 1px solid var(--mp-outline); background: var(--mp-card); box-shadow: var(--mp-drop); font-size: 13px; }
.mp-input::placeholder, .mp-textarea::placeholder { color: var(--muted-foreground); }

/* Popover / menu (BB popover + command) and dialog */
.mp-popover { position: absolute; z-index: 30; width: 300px; max-width: calc(100% - 16px); padding: 6px; border: 1px solid var(--mp-hairline); border-radius: 12px; background: var(--popover); box-shadow: var(--shadow-lg); }
.mp-popover .mp-nav-item { min-height: 44px; }
.mp-menu-label { padding: 6px 8px 4px; font-size: 11px; font-weight: 500; color: var(--muted-foreground); text-transform: uppercase; letter-spacing: 0.04em; }
.mp-scrim { position: absolute; inset: 0; z-index: 20; background: color-mix(in oklab, var(--pk-shell, var(--background)) 55%, transparent); backdrop-filter: blur(1px); }
.mp-dialog { position: absolute; z-index: 25; border: 1px solid var(--mp-hairline); border-radius: 20px; background: var(--pk-panel, var(--background)); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; overflow: hidden; }

/* Platform picker grid (inside a popover) */
.mp-plat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; }
.mp-plat-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px 8px; border-radius: 8px; font-size: 11px; color: var(--muted-foreground); text-align: center; }
.mp-plat-btn:hover { background: var(--state-hover); color: var(--foreground); }
.mp-plat-btn[aria-disabled="true"] { opacity: 0.45; cursor: not-allowed; }
.mp-plat-btn .mp-tile { width: 36px; height: 36px; border-radius: 10px; color: var(--foreground); }

/* ---------- 4. Chat: stands in for the SDK ThreadChat (compact) ---------- */
.mp-chat { display: flex; flex-direction: column; min-height: 0; min-width: 0; flex: 1; }
:has(> .mp-chat) { min-width: 0; }
.mp-chat-log { overflow-x: hidden; }
.mp-chat-log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding: 16px; }
.mp-msg { display: flex; gap: 8px; max-width: 100%; font-size: 13px; line-height: 1.5; }
.mp-msg p { margin: 0 0 6px; } .mp-msg p:last-child { margin: 0; }
.mp-msg-user { align-self: flex-end; max-width: 86%; padding: 8px 12px; border-radius: 12px; background: var(--mp-well); border: 1px solid var(--mp-hairline); overflow-wrap: anywhere; }
.mp-msg-agent .mp-msg-body { flex: 1; min-width: 0; }
.mp-msg-agent .mp-avatar { width: 24px; height: 24px; font-size: 10px; }
.mp-msg-who { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
.mp-tool { display: flex; align-items: center; gap: 8px; padding: 6px 8px; margin: 6px 0; border-radius: 8px; background: var(--mp-well); border: 1px solid var(--mp-hairline); font-size: 12px; }
.mp-tool .mp-tool-name { font-weight: 500; white-space: nowrap; }
.mp-spin { width: 12px; height: 12px; border-radius: 9999px; border: 2px solid color-mix(in oklab, var(--mp-info) 25%, transparent); border-top-color: var(--mp-info); animation: mp-spin 0.9s linear infinite; flex-shrink: 0; }
@keyframes mp-spin { to { transform: rotate(360deg); } }
.mp-suggest { display: flex; flex-wrap: wrap; gap: 6px; }
.mp-chip { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 10px; border-radius: 9999px; font-size: 12px; border: 1px solid var(--mp-outline); background: var(--mp-card); box-shadow: var(--mp-drop); white-space: nowrap; }
.mp-chip:hover { background: color-mix(in oklab, var(--mp-card) 92%, var(--foreground)); }
.mp-composer { margin: 0 12px 12px; padding: 8px; border-radius: 12px; border: 1px solid var(--mp-outline); background: var(--mp-card); box-shadow: var(--mp-drop); flex-shrink: 0; }
.mp-composer textarea { width: 100%; min-height: 40px; max-height: 120px; resize: none; border: 0; outline: 0; background: transparent; font-size: 13px; padding: 4px; }
.mp-composer-row { display: flex; align-items: center; gap: 4px; }
.mp-model { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: 6px; font-size: 12px; color: var(--muted-foreground); }
.mp-model:hover { background: var(--state-hover); }
.mp-model i { width: 14px; height: 14px; border-radius: 4px; background: color-mix(in oklab, var(--mp-warning) 55%, var(--mp-card)); }
.mp-send { width: 28px; height: 28px; border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center; background: var(--foreground); color: var(--background); }
.mp-chat-head { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--mp-hairline); flex-shrink: 0; }
.mp-proposal { margin-top: 8px; border: 1px solid var(--mp-hairline); border-radius: 12px; background: var(--mp-card); overflow: hidden; }
.mp-proposal-row { padding: 8px 12px; font-size: 13px; }
.mp-proposal-row + .mp-proposal-row { border-top: 1px solid var(--mp-hairline); }
.mp-proposal del { color: var(--muted-foreground); }
.mp-proposal ins { text-decoration: none; background: color-mix(in oklab, var(--mp-success) 14%, transparent); border-radius: 4px; padding: 0 2px; }
.mp-proposal-actions { display: flex; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--mp-hairline); background: var(--mp-well); }

/* ---------- 5. Editor bits ---------- */
.mp-doc { outline: 0; font-size: 15px; line-height: 1.6; }
.mp-doc p { margin: 0 0 12px; }
.mp-doc .mp-hl { background: color-mix(in oklab, var(--primary) 16%, transparent); border-radius: 4px; box-shadow: 0 0 0 2px color-mix(in oklab, var(--primary) 16%, transparent); }
.mp-doc .mp-fresh { background: color-mix(in oklab, var(--mp-success) 14%, transparent); border-radius: 4px; }
.mp-count { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted-foreground); white-space: nowrap; }
.mp-ring { width: 22px; height: 22px; flex-shrink: 0; }
.mp-ring circle { fill: none; stroke-width: 2.5; }
.mp-ring .bg { stroke: var(--mp-hairline); }
.mp-ring .fg { stroke: var(--mp-info); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
.mp-ring.warn .fg { stroke: var(--mp-warning); } .mp-ring.over .fg { stroke: var(--destructive); }
.mp-tweet-ta { width: 100%; min-height: 44px; resize: none; overflow: hidden; border: 0; outline: 0; background: transparent; font-size: 14px; line-height: 1.5; padding: 0; }
.mp-rules { display: flex; flex-wrap: wrap; gap: 6px; }
.mp-rule { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted-foreground); padding: 2px 8px; border-radius: 9999px; background: color-mix(in oklab, var(--foreground) 5%, transparent); }

/* Portrait (style profile) */
.mp-trait { display: flex; gap: 8px; align-items: baseline; padding: 6px 0; font-size: 13px; }
.mp-trait + .mp-trait { border-top: 1px solid var(--mp-hairline); }
.mp-trait .k { color: var(--muted-foreground); width: 46%; flex-shrink: 0; }
.mp-trait .v { font-weight: 500; font-variant-numeric: tabular-nums; min-width: 0; }
.mp-layer { display: flex; align-items: center; gap: 8px; }
.mp-skel { height: 10px; border-radius: 6px; background: linear-gradient(90deg, var(--mp-well), color-mix(in oklab, var(--foreground) 9%, var(--mp-well)), var(--mp-well)); background-size: 200% 100%; animation: mp-shimmer 1.4s ease-in-out infinite; }
@keyframes mp-shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.mp-bar { height: 6px; border-radius: 9999px; background: var(--mp-well); overflow: hidden; box-shadow: inset 0 0 0 1px var(--mp-hairline); }
.mp-bar > i { display: block; height: 100%; border-radius: 9999px; background-image: var(--mp-accent); }

/* Empty state */
.mp-empty { max-width: 460px; margin: 0 auto; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 40px 24px; }
.mp-empty .mp-tile { width: 48px; height: 48px; border-radius: 14px; }

/* View switching driven by data-view on .mp-app */
[data-show]:not(.is-on) { display: none !important; }
.mp-hidden { display: none !important; }
@media (prefers-reduced-motion: reduce) { .mp-spin, .mp-skel { animation: none; } }

/* X twins: one tweet card holds the EN and RU versions. */
.mp-tweet { border: 1px solid var(--mp-hairline); border-radius: 12px; background: var(--mp-card); box-shadow: var(--mp-drop); min-width: 0; }
.mp-tweet-head { padding: 6px 8px 0 12px; }
.mp-tweet-body { display: grid; }
.mp-twin { padding: 8px 12px 12px; min-width: 0; }
.mp-tweet-stack .mp-twin + .mp-twin { border-top: 1px solid var(--mp-hairline); }
.mp-tweet-side .mp-tweet-body { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.mp-tweet-side .mp-twin + .mp-twin { border-left: 1px solid var(--mp-hairline); }
@container mp (max-width: 720px) {
  .mp-tweet-side .mp-tweet-body { grid-template-columns: minmax(0, 1fr); }
  .mp-tweet-side .mp-twin + .mp-twin { border-left: 0; border-top: 1px solid var(--mp-hairline); }
}


/* ---------- Variant A2: profile level as in A; inside a post two columns [post | chat] ---------- */

/* Profile level (copied from A without the draft column) */
.a-layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 248px minmax(0, 1fr); }
.a-tabs { display: none; padding: 8px 12px; border-bottom: 1px solid var(--mp-hairline); }
.a-tabs .mp-seg { width: 100%; } .a-tabs .mp-seg-item { flex: 1; justify-content: center; }
.a-rail { position: relative; display: flex; flex-direction: column; gap: 12px; min-height: 0; padding: 12px; border-right: 1px solid var(--mp-hairline); }
.a-switch { display: flex; align-items: center; gap: 8px; width: 100%; height: 48px; padding: 0 8px; border-radius: 8px; text-align: left; }
.a-switch .name { display: block; font-weight: 600; font-size: 13px; color: var(--foreground); }
.a-rail .mp-menu-label { padding: 4px 8px 0; }
.a-rail-scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; margin: 0 -4px; padding: 0 4px; }
.a-plat .mp-nav-item { min-height: 36px; }
.a-plat .n { margin-left: auto; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted-foreground); }
.a-post { display: flex; gap: 8px; align-items: flex-start; padding: 8px; min-height: 52px; }
.a-post .t { display: block; font-size: 13px; font-weight: 500; color: var(--foreground); }
.a-post .m { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 12px; }
#a-sw { top: 64px; left: 12px; width: 312px; }
#a-new { top: 116px; left: 12px; width: 312px; }
.a-centre { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.a-head { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 24px; border-bottom: 1px solid var(--mp-hairline); flex-shrink: 0; }
.a-body { flex: 1; min-height: 0; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.a-centre[data-ctab="chat"] .a-body.home-only, .a-centre[data-ctab="overview"] .a-stylechat { display: none !important; }
.a-centre .mp-chat { max-width: 760px; width: 100%; margin: 0 auto; }
.a-grid2 { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.a-platcard { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
.a-platcard + .a-platcard { border-top: 1px solid var(--mp-hairline); }
.a-rowlist .a-row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 8px; border-radius: 8px; cursor: pointer; }
.a-rowlist .a-row:hover { background: var(--state-hover); }
.a-rowlist .a-row + .a-row { box-shadow: 0 -1px 0 var(--mp-hairline); }
.a-pinned { position: sticky; top: -16px; z-index: 2; align-self: stretch; box-shadow: var(--mp-drop); }
.a-pinned[open] summary [data-ico="chev"] { transform: rotate(180deg); }
#a-stylechat .mp-chat, #a-create .mp-chat { flex: 1; }

/* Post level: crumb bar on top, then [post | divider | chat] */
.a2-work { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.a2-bar { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 12px; border-bottom: 1px solid var(--mp-hairline); flex-shrink: 0; position: relative; }
.a2-crumb { display: flex; align-items: center; gap: 4px; min-width: 0; flex: 1; font-size: 13px; color: var(--muted-foreground); }
.a2-crumb > [data-ico] { flex-shrink: 0; }
.a2-crumb-btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 6px; border-radius: 8px; white-space: nowrap; flex-shrink: 0; }
.a2-crumb-btn:hover { background: var(--state-hover); color: var(--foreground); }
.a2-crumb-btn .mp-avatar { width: 20px; height: 20px; font-size: 9px; }
.a2-crumb-btn .mp-tile.sm { width: 20px; height: 20px; border-radius: 6px; }
.a2-crumb-title { min-width: 0; padding: 0 6px; color: var(--foreground); font-weight: 500; }
.a2-tabs { display: none; }
.a2-tabs .mp-seg-item { min-width: 64px; justify-content: center; }
.a2-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 9999px; font-size: 10px; font-weight: 600; background-image: var(--mp-accent); background-color: var(--primary); color: #ffffff; }
.a2-badge:empty { display: none; }
#a2-posts { top: 44px; right: 12px; width: 340px; max-height: min(480px, calc(100% - 56px)); overflow-y: auto; }

.a2-split { --a2-chat-w: 400px; flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 9px var(--a2-chat-w); }
.a2-divider { position: relative; cursor: col-resize; touch-action: none; }
.a2-divider::before { content: ""; position: absolute; top: 0; bottom: 0; left: 4px; width: 1px; background: var(--mp-hairline); }
.a2-divider::after { content: ""; position: absolute; top: 50%; left: 2px; width: 5px; height: 32px; margin-top: -16px; border-radius: 9999px; background: var(--mp-outline); }
.a2-divider:hover::before, .a2-divider.is-drag::before, .a2-divider:focus-visible::before { left: 3px; width: 3px; background: color-mix(in oklab, var(--primary) 45%, transparent); }
.a2-divider:focus-visible { outline: 0; }

/* Post column */
.a2-post { container-type: inline-size; container-name: a2post; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.a2-post-head { display: flex; flex-direction: column; gap: 8px; padding: 16px max(24px, calc((100% - 712px) / 2)) 12px; border-bottom: 1px solid var(--mp-hairline); flex-shrink: 0; }
.a2-meta-row { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; row-gap: 8px; }
.a2-platname { font-size: 13px; font-weight: 500; white-space: nowrap; }
.a2-title { outline: 0; font-size: 22px; font-weight: 600; line-height: 30px; overflow-wrap: anywhere; border-radius: 6px; }
.a2-title:focus-visible { box-shadow: 0 0 0 2px var(--ring); }
.a2-post-body { flex: 1; min-height: 0; overflow-y: auto; background: color-mix(in oklab, var(--mp-well) 55%, var(--pk-panel, var(--background))); }
.a2-page { max-width: 760px; margin: 0 auto; padding: 16px 24px 32px; display: flex; flex-direction: column; gap: 12px; }
.a2-post[data-mode="editor"] .a2-pv, .a2-post[data-mode="preview"] .a2-ed { display: none !important; }
.a2-edcard { padding: 20px; }
.a2-edwrap { position: relative; }
.a2-edtools { display: flex; align-items: center; gap: 4px; padding-top: 12px; margin-top: 4px; border-top: 1px solid var(--mp-hairline); }
.a2-sel { position: absolute; z-index: 5; display: flex; max-width: 100%; overflow-x: auto; scrollbar-width: none; gap: 2px; padding: 4px; border-radius: 12px; border: 1px solid var(--mp-hairline); background: var(--popover); box-shadow: var(--shadow-lg); white-space: nowrap; }
.a2-sel[hidden] { display: none; }
.a2-post-foot { display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 max(16px, calc((100% - 712px) / 2)); border-top: 1px solid var(--mp-hairline); flex-shrink: 0; background: var(--pk-panel, var(--background)); }
.a2-post-foot .saved { display: inline-flex; align-items: center; gap: 6px; }

/* X twins inside the post column: stacked below 700px of post width, side by side above. */
.a2-tweet .a2-tw-body { display: grid; grid-template-columns: minmax(0, 1fr); }
.a2-tweet .mp-twin + .mp-twin { border-top: 1px solid var(--mp-hairline); }
@container a2post (min-width: 700px) {
  .a2-tweet .a2-tw-body { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .a2-tweet .mp-twin + .mp-twin { border-top: 0; border-left: 1px solid var(--mp-hairline); }
}
.a2-stale-only { display: none !important; }
.mp-twin.is-stale .a2-stale-only { display: inline-flex !important; }
.mp-twin.is-stale .a2-sync-row { display: flex !important; }
.a2-sync-row { align-items: center; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--mp-hairline); }
.mp-twin.is-fresh { background: color-mix(in oklab, var(--mp-success) 9%, transparent); transition: background 0.6s; }

/* Previews (from C): neutral surfaces, the platform is named, not imitated in colour. */
.a2-phone { max-width: 420px; width: 100%; margin: 0 auto; border-radius: 16px; border: 1px solid var(--mp-hairline); background: var(--mp-well); overflow: hidden; box-shadow: var(--mp-drop); }
.a2-phone .hd { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--mp-card); border-bottom: 1px solid var(--mp-hairline); }
.a2-bubble { margin: 12px; padding: 10px 12px 6px; border-radius: 12px; background: var(--mp-card); box-shadow: var(--mp-drop); font-size: 13px; line-height: 1.5; }
.a2-bubble p { margin: 0 0 8px; }
.a2-bubble .ft { display: flex; justify-content: flex-end; gap: 8px; font-size: 11px; color: var(--muted-foreground); }
.a2-xprev { max-width: 520px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.a2-xcard { padding: 12px; border-radius: 12px; border: 1px solid var(--mp-hairline); background: var(--mp-card); box-shadow: var(--mp-drop); font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.a2-xcard .who { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 13px; min-width: 0; }

/* Chat column */
.a2-chat { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--pk-panel, var(--background)); }
.a2-chat > [data-show] { flex: 1; min-height: 0; display: flex; }
.a2-chat .mp-chat-log { padding: 12px 16px; gap: 12px; }
.a2-chat .mp-tool { padding: 4px 8px; margin: 4px 0; }
.a2-chat .mp-proposal-row .mp-meta { font-weight: 500; }
.a2-quote { display: block; margin-bottom: 4px; padding-left: 8px; border-left: 2px solid var(--mp-outline); color: var(--muted-foreground); font-size: 12px; }
#a2-model { left: 16px; bottom: 64px; top: auto; width: 260px; }

/* Wide-but-not-huge pane: a slimmer default chat. */
@container mp (max-width: 1279px) {
  .a2-split { --a2-chat-w: 380px; }
  .a-grid2 { grid-template-columns: minmax(0, 1fr); }
  .a2-crumb-title, .a2-crumb-title-sep { display: none; }
}
/* Narrow pane (<= 900, BB's content threshold is 880): post and chat become tabs. */
@container mp (max-width: 900px) {
  .a2-tabs { display: inline-flex; }
  .a2-split { grid-template-columns: minmax(0, 1fr) !important; }
  .a2-divider { display: none; }
  .a2-work[data-pane="post"] .a2-chat, .a2-work[data-pane="chat"] .a2-post { display: none; }
  .a2-posts-btn .lbl { display: none; }
}
/* Narrow pane: profile level as in A (tabs Posts | Voice). */
@container mp (max-width: 720px) {
  .a-tabs { display: block; }
  .a-layout { grid-template-columns: minmax(0, 1fr); }
  .a-layout > .a-rail, .a-layout > .a-centre { display: none; border: 0; }
  .a-layout[data-apane="rail"] > .a-rail, .a-layout[data-apane="centre"] > .a-centre { display: flex; }
  .a-head, .a-body { padding-left: 16px; padding-right: 16px; }
  .a-body { padding-top: 16px; }
  #a-sw, #a-new, #a2-posts { left: 8px; right: 8px; width: auto; }
  .a2-post-head { padding: 12px 16px 10px; }
  .a2-title { font-size: 19px; line-height: 26px; }
  .a2-page { padding: 12px 12px 24px; }
  .a2-edcard { padding: 16px; }
  .a2-post-foot { padding: 0 12px; }
  .a2-post-foot .saved, .a2-copy .lbl, .a2-crumb .a2-crumb-name, .a2-crumb .a2-crumb-plat { display: none; }
  .a2-sel { left: 0 !important; }
}
.a-switchy { width: 28px; height: 16px; border-radius: 9999px; background-color: var(--primary); background-image: var(--mp-accent); position: relative; display: inline-block; flex-shrink: 0; }
.a-switchy::after { content: ""; position: absolute; top: 2px; right: 2px; width: 12px; height: 12px; border-radius: 9999px; background: #ffffff; box-shadow: 0 1px 2px rgb(0 0 0 / 0.2); }
</style>
</head>
<body>
<div class="proto-bar"></div>
<div class="bb-shell">
  <div class="bb-side" aria-hidden="true"><span></span><span class="on"></span><span></span><span></span></div>
  <div class="bb-pane">
    <div class="bb-pane-head"><span class="bb-dot"></span><span data-i18n="app.name"></span><span class="bb-crumb">· A2</span></div>
    <div class="mp-app" data-bb-plugin="my-posts">

      <!-- ================= Profile level: exactly A (rail + overview / style chat) ================= -->
      <div class="a-tabs" data-show="empty switcher create home">
        <div class="mp-seg" data-seg="apane" data-seg-target=".a-layout" role="tablist">
          <button class="mp-seg-item" data-val="rail" data-i18n="a.tab.rail"></button>
          <button class="mp-seg-item" data-val="centre" data-i18n="a.tab.voice"></button>
        </div>
      </div>
      <div class="a-layout" data-show="empty switcher create home" data-apane="centre">
        <aside class="a-rail">
          <button class="a-switch mp-raised" data-pop="a-sw" aria-haspopup="menu" aria-expanded="false" data-i18n-aria="profile.switch">
            <span id="a-sw-av"></span>
            <span class="mp-grow"><span class="name mp-truncate" id="a-sw-name"></span><span class="mp-meta mp-truncate" id="a-sw-meta" style="display:block"></span></span>
            <span data-ico="chev" style="color:var(--muted-foreground)"></span>
          </button>
          <div class="mp-popover mp-hidden" id="a-sw" role="menu"></div>
          <button class="mp-btn mp-accent" data-show="home switcher" data-pop="a-new" style="width:100%"><span data-ico="plus"></span><span data-i18n="post.new"></span></button>
          <div class="mp-popover mp-hidden" id="a-new" role="menu"></div>
          <div class="a-rail-scroll" data-show="home switcher">
            <div class="mp-menu-label" data-i18n="a.platforms"></div>
            <div class="a-plat" id="a-plat"></div>
            <div class="mp-menu-label" style="margin-top:8px" data-i18n="post.posts"></div>
            <div id="a-posts"></div>
          </div>
          <p class="mp-meta" data-show="create" style="margin:0;padding:0 8px" data-i18n="a.create_note"></p>
          <p class="mp-meta" data-show="empty" style="margin:0;padding:0 8px" data-i18n="a.empty_note"></p>
        </aside>

        <main class="a-centre" data-ctab="overview">
          <div class="a-head" data-show="home switcher">
            <span class="mp-seg" data-seg="ctab" data-seg-target=".a-centre">
              <button class="mp-seg-item" data-val="overview" data-i18n="a.overview"></button>
              <button class="mp-seg-item" data-val="chat" data-i18n="a.stylechat"></button>
            </span>
            <span class="mp-grow"></span>
            <button class="mp-btn sm mp-raised"><span data-ico="refresh"></span><span data-i18n="a.refresh"></span></button>
          </div>
          <div class="a-head" data-show="create">
            <span class="mp-tile"><span data-ico="spark"></span></span>
            <span class="mp-h2" data-i18n="a.new_profile"></span>
            <span id="a-build-pill"></span>
            <span class="mp-grow"></span>
            <button class="mp-btn sm ghost" data-go="switcher" data-i18n="a.cancel"></button>
          </div>
          <div class="a-body home-only" data-show="home switcher">
            <div class="mp-strip mp-row" style="gap:12px;padding:14px 16px">
              <span class="mp-avatar lg">МГ</span>
              <span class="mp-grow"><h1 class="mp-h1">Мой голос</h1><span class="mp-meta"><span>t.me/bez_filtrov_demo</span> · <span data-i18n="profile.mine.meta"></span> · <span data-i18n="a.portrait_from"></span></span></span>
              <span id="a-ready-pill"></span>
            </div>
            <div class="a-grid2">
              <section class="mp-panel"><div class="mp-panel-head"><span data-i18n="portrait.title"></span><span class="mp-help">?</span></div>
                <div class="mp-panel-body" id="a-portrait"></div></section>
              <section class="mp-panel"><div class="mp-panel-head"><span data-i18n="a.platforms"></span><span class="mp-grow"></span><span class="mp-meta mp-num">12</span></div>
                <div class="mp-panel-body" style="padding:0 16px" id="a-platcards"></div></section>
            </div>
            <section class="mp-panel"><div class="mp-panel-head"><span data-i18n="a.recent"></span></div>
              <div class="mp-panel-body a-rowlist" style="padding:4px" id="a-recent"></div></section>
          </div>
          <div class="a-stylechat" data-show="home switcher" style="flex:1;min-height:0;display:flex">
            <div id="a-stylechat" style="flex:1;min-height:0;display:flex"></div>
          </div>
          <div data-show="create" style="flex:1;min-height:0;display:flex" id="a-create"></div>
          <div data-show="empty" class="a-body" style="justify-content:center">
            <div class="mp-card mp-empty" style="padding:40px 24px">
              <span class="mp-tile"><span data-ico="spark" class="ico-20"></span></span>
              <h1 class="mp-h1" style="font-size:18px" data-i18n="empty.title"></h1>
              <p style="margin:0;color:var(--muted-foreground)" data-i18n="empty.what"></p>
              <p class="mp-meta" style="margin:0" data-i18n="empty.how"></p>
              <button class="mp-btn mp-accent" data-go="create"><span data-ico="plus"></span><span data-i18n="profile.create"></span></button>
            </div>
          </div>
        </main>
      </div>

      <!-- ================= Post level: [ post | chat ], the rail is gone ================= -->
      <div class="a2-work" data-show="tg x tgprev narrow" data-pane="post">
        <header class="a2-bar">
          <button class="mp-btn sm icon ghost" data-go="home" data-i18n-aria="a2.back"><span data-ico="back"></span></button>
          <nav class="a2-crumb" data-i18n-aria="a2.crumb">
            <button class="a2-crumb-btn" data-go="home"><span class="mp-avatar">МГ</span><span class="a2-crumb-name">Мой голос</span></button>
            <span data-ico="chevr"></span>
            <button class="a2-crumb-btn" data-go="home" id="a2-crumb-plat"></button>
            <span data-ico="chevr" class="a2-crumb-title-sep"></span>
            <span class="a2-crumb-title mp-truncate" id="a2-crumb-title"></span>
          </nav>
          <span class="mp-seg a2-tabs" data-seg="pane" data-seg-target=".a2-work" role="tablist">
            <button class="mp-seg-item" data-val="post" data-i18n="a2.tab.post"></button>
            <button class="mp-seg-item" data-val="chat"><span data-i18n="a2.tab.chat"></span><span class="a2-badge" id="a2-badge"></span></button>
          </span>
          <button class="mp-btn sm mp-raised a2-posts-btn" data-pop="a2-posts" aria-haspopup="menu" aria-expanded="false" data-i18n-aria="post.posts"><span data-ico="list"></span><span class="lbl" data-i18n="post.posts"></span><span data-ico="chev"></span></button>
          <div class="mp-popover mp-hidden" id="a2-posts" role="menu"></div>
        </header>

        <div class="a2-split" id="a2-split">
          <!-- POST: the main focus -->
          <section class="a2-post" data-mode="editor" data-i18n-aria="a2.tab.post">
            <div class="a2-post-head">
              <div class="a2-meta-row">
                <span id="a2-tile"></span><span class="a2-platname" id="a2-platname"></span><span id="a2-pill"></span>
                <span class="mp-grow"></span>
                <span class="mp-seg" data-seg="mode" data-seg-target=".a2-post" role="tablist">
                  <button class="mp-seg-item" data-val="editor"><span data-ico="doc"></span><span data-i18n="a2.editor"></span></button>
                  <button class="mp-seg-item" data-val="preview"><span data-ico="eye"></span><span data-i18n="a2.preview"></span></button>
                </span>
              </div>
              <div class="a2-title" id="a2-title" contenteditable="true" role="textbox" data-i18n-aria="post.title_ph"></div>
            </div>

            <div class="a2-post-body">
              <div class="a2-page">
                <div class="mp-rules" id="a2-rules"></div>

                <!-- Telegram editor -->
                <div class="a2-ed mp-card a2-edcard" data-show="tg tgprev narrow">
                  <div class="a2-edwrap">
                    <div class="a2-sel" id="a2-sel" role="toolbar" data-i18n-aria="a2.seltools">
                      <button class="mp-btn sm ghost" data-a2ask="shorter"><span data-i18n="sug.shorter"></span></button>
                      <button class="mp-btn sm ghost" data-a2ask="sharper"><span data-i18n="a2.sharper"></span></button>
                      <button class="mp-btn sm ghost" data-a2ask="voice"><span data-i18n="a2.invoice"></span></button>

  function len(el) { const v = el.value !== undefined ? el.value : el.innerText; return [...v.replace(/\n+$/, '')].length; }
  function refreshCounters() {

    document.querySelectorAll('[data-count]').forEach((el) => {

  };
  /* ?check=1: walk every state, measure real boxes, report anything wider than the pane

  function selfCheck() {

      if (app.scrollWidth > app.clientWidth + 1) out.push(`${v}: app scrollWidth ${app.scrollWidth} > ${app.clientWidth}`);
      app.querySelectorAll('*').forEach((el) => {
        if (!el.offsetParent || el.closest('.mp-popover,.mp-seg,.b-board,.b-voice,.c-inline,.a2-sel,.mp-chat-log,.mp-scroll,.a-rail-scroll,[aria-hidden="true"]')) return;

      });
      app.querySelectorAll('input.a-title, input.b-ed-title, .c-title, .a2-title, .mp-h1').forEach((el) => {
        if (!el.offsetParent) return;
        const need = el.tagName === 'INPUT' ? el.scrollWidth : el.scrollWidth;
        if (need > el.clientWidth + 1) out.push(`${v}: title clipped ${need}px in ${el.clientWidth}px: ${(el.value || el.textContent).slice(0, 40)}`);

  }

})();

    user('Добавь в табу «кейс» и «инсайт» — я их не пишу'),
    agent('chat.style_agent', tool('style-portrait', 'слой C · правила', 'done') + '<p>Добавил в слой C. Новые черновики будут без этих слов; старые не трогаю.</p>'),
    user('Почему в портрете «ирония без сарказма»?'),
    agent('chat.style_agent', '<p>В 41 посте из 146 есть самоирония про собственные решения, и ни разу — насмешка над читателем. Пример: «Я, конечно, гений планирования: третий роадмап за квартал».</p>'),
  ].join('');

  MP.tgLog = () => [
    user('Сделай первую строку острее и убери слово «кликбейт»'),
    agent('chat.copywriter', tool('writing-in-style', 'профиль «Мой голос»', 'done') +
      '<p>Переписал начало: первая строка теперь 52 знака (правило профиля — до 70), «кликбейт» убрал, абзац стал на 18% короче.</p>' +
      `<div class="mp-proposal"><div class="mp-proposal-row"><span class="mp-meta">${T('chat.before')}</span><br><del>Я полгода не пишу роадмапы. И команда стала выпускать больше. Звучит как кликбейт, но вот что произошло.</del></div>
       <div class="mp-proposal-row"><span class="mp-meta">${T('chat.after')}</span><br><ins>Полгода без роадмапа — и релизов стало вдвое больше. Вот что произошло.</ins></div>
       <div class="mp-proposal-actions"><span class="mp-pill mp-pill-success">${I('check', 'ico-14')}${T('status.done')}</span></div></div>`),
    user('Проверь под Telegram: длина и форматирование'),
    agent('chat.copywriter', tool('telegram-rules', '4096 · markdown', 'done') +
      '<p>461 из 4096 знаков — запас большой, сокращать не нужно. Жирным выделил тезис в третьем абзаце, ссылок нет — превью не понадобится. В последней строке вопрос читателю, как у вас в 72% постов.</p>' +
      `<div class="mp-proposal"><div class="mp-proposal-row"><span class="mp-meta">${T('chat.after')}</span><br>А вы как планируете — <ins>по датам или по ставкам?</ins> Пишите в комментариях, соберу ответы в следующий пост.</div>
       <div class="mp-proposal-actions"><button class="mp-btn sm mp-raised" data-apply="tg-end">${I('check')}${T('chat.apply')}</button><button class="mp-btn sm ghost">${T('chat.reject')}</button></div></div>`),
  ].join('');

  MP.xLog = () => [
    user('Сделай из поста про роадмапы тред на 3 твита'),
    agent('chat.copywriter', tool('writing-in-style', 'профиль «Мой голос» · X', 'done') + tool('x-twins', 'EN → RU, 3 × 2', 'done') +
      '<p>Готово: 3 твита, у каждого две версии. EN пишу первой, RU — не дословный перевод, а та же мысль в голосе профиля. Все твиты укладываются в 280.</p>'),
    `<div class="mp-tool" style="align-self:stretch">${I('refresh', 'ico-14 mp-text-warning')}<span>Вы изменили EN во 2-м твите — RU отстаёт.</span><span class="mp-grow"></span><button class="mp-btn sm mp-raised" data-say="sug.translate" onclick="this.closest('.mp-chat').querySelector('textarea').value=MP.t('sug.translate')">${T('sug.translate')}</button></div>`,
  ].join('');

  MP.chatHTML = ({ who = 'chat.copywriter', skill = 'writing-in-style', log = '', ph = 'chat.ph', chips = [], head = '' }) =>
    `<div class="mp-chat" data-who="${who}" data-skill="${skill}">${head}<div class="mp-chat-log">${log}</div>${chips.length ? MP.chips(chips) : ''}${MP.composer(ph)}</div>`;

  /* Portrait: state = 'building' (A done, B running, C waiting) or 'done'. */
  MP.portraitHTML = (state, { compact = false } = {}) => {
    const b = state === 'done';
    const rowsA = D.metrics.slice(0, compact ? 4 : 6).map(([k, v]) => `<div class="mp-trait"><span class="k">${T(k)}</span><span class="v">${MP.L(v)}</span></div>`).join('');
    const sk = (w) => `<div class="mp-skel" style="width:${w}%;margin:8px 0"></div>`;
    const head = (k, st) => `<div class="mp-layer" style="margin:12px 0 4px"><span class="mp-h2">${T(k)}</span><span class="mp-grow"></span>${MP.pill(st)}</div>`;
    return `${head('portrait.layerA', 'done')}${rowsA}
      ${head('portrait.layerB', b ? 'done' : 'running')}
      ${b ? `<ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.7">${D.voice.slice(0, compact ? 4 : 6).map((v) => `<li>${v}</li>`).join('')}</ul>` : `<ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.7"><li>${D.voice[0]}</li><li>${D.voice[1]}</li></ul>${sk(80)}${sk(56)}`}
      ${head('portrait.layerC', b ? 'done' : 'waiting')}
      ${b ? `<ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.7">${D.rules.map((v) => `<li>${v}</li>`).join('')}</ul>` : `${sk(70)}${sk(45)}`}
      ${b && !compact ? `<p class="mp-meta" style="margin:12px 0 0">${T('portrait.leak')}: ${D.leak}.</p>` : ''}`;
  };

  MP.portraitProgress = () => `<span class="mp-row" style="gap:4px;flex-wrap:wrap"><span class="mp-pill mp-pill-success">A ✓</span><span class="mp-pill mp-pill-info"><span class="mp-spin" style="width:10px;height:10px;border-width:1.5px"></span>B</span><span class="mp-pill mp-pill-muted">C</span></span>`;
  MP.tgDocHTML = () => D.tg.map((p, i) => `<p${i === 0 ? ' class="mp-fresh-wrap"' : ''}>${i === 0 ? `<span class="mp-fresh">${p}</span>` : i === 4 ? `<span id="tg-end">${p}</span>` : p}</p>`).join('');
  MP.onApply = (id) => { if (id === 'tg-end') document.querySelectorAll('#tg-end').forEach((e) => { e.innerHTML = 'А вы как планируете — <span class="mp-fresh">по датам или по ставкам?</span> Пишите в комментариях, соберу ответы в следующий пост.'; }); MP.refreshCounters(); };

  /* One tweet: EN + RU twins. layout 'stack' (EN above RU) or 'side' (columns). */
  MP.tweetHTML = (i, tw, layout, pfx) => {
    const half = (lang) => `
      <div class="mp-twin">
        <div class="mp-row" style="margin-bottom:6px;flex-wrap:wrap;row-gap:4px"><span class="mp-pill ${lang === 'en' ? 'mp-pill-neutral' : 'mp-pill-muted'}">${lang.toUpperCase()}</span>
          ${lang === 'ru' && tw.stale ? MP.pill('stale') : ''}<span class="mp-grow"></span>
          <span class="mp-row" style="gap:6px"><span class="mp-count" id="${pfx}c${i}${lang}"></span><span data-ring-slot="${pfx}r${i}${lang}"></span></span></div>
        <textarea class="mp-tweet-ta" data-count="280" data-count-out="${pfx}c${i}${lang}" data-ring="${pfx}r${i}${lang}" aria-label="${t('x.tweet')} ${i + 1} ${lang.toUpperCase()}">${tw[lang]}</textarea>
      </div>`;
    return `<div class="mp-tweet mp-tweet-${layout}" data-layout="${layout}"><div class="mp-row mp-tweet-head"><span class="mp-meta mp-num">${T('x.tweet')} ${i + 1}</span><span class="mp-grow"></span><button class="mp-btn sm icon ghost" aria-label="more">${MP.icons('more')}</button></div><div class="mp-tweet-body">${half('en')}${half('ru')}</div></div>`;
  };
})();

</script>
<script>
(function () {
  const MP = window.MP, D = MP.DATA;
  MP.add({
    'view.tgprev': 'TG preview', 'view.narrow': 'Narrow: chat',
    'a.tab.rail': 'Posts', 'a.tab.voice': 'Voice', 'a.platforms': 'Platforms', 'a.overview': 'Overview', 'a.stylechat': 'Style chat',

    'a2.divider': 'Resize the chat column', 'a2.model.default': 'default', 'a2.model.all': 'All BB models…', 'a2.models': 'Model',
    'a2.marked': 'Ready', 'a2.stale_hint': 'EN was edited after this RU', 'a2.synced': 'RU of tweet {n} rewritten from the new EN, in the profile voice.',
  }, {
    'view.tgprev': 'Превью TG', 'view.narrow': 'Узко: чат',
    'a.tab.rail': 'Посты', 'a.tab.voice': 'Голос', 'a.platforms': 'Площадки', 'a.overview': 'Обзор', 'a.stylechat': 'Чат стиля',
    'a.refresh': 'Обновить портрет', 'a.portrait_from': 'портрет от 3 нояб.', 'a.recent': 'Последние посты', 'a.new_profile': 'Новый профиль', 'a.cancel': 'Отмена',
    'a.no_profile': 'Нет профиля', 'a.pick_profile': 'Создайте первый', 'a.create_note': 'Площадки и посты появятся, когда профиль будет сохранён.', 'a.empty_note': 'Здесь будут профили, которые вы создадите.',
    'a.c.draft': 'черн.', 'a.c.ready': 'гот.', 'a.c.published': 'опубл.',
    'a2.back': 'К профилю', 'a2.crumb': 'Путь', 'a2.tab.post': 'Пост', 'a2.tab.chat': 'Чат', 'a2.editor': 'Редактор', 'a2.preview': 'Превью',
    'a2.saved': 'Сохранено · 12:40', 'a2.seltools': 'Действия с выделенным', 'a2.sharper': 'Острее', 'a2.invoice': 'В голосе профиля', 'a2.ask': 'Спросить…',
    'a2.ask.shorter': 'Сократи это', 'a2.ask.sharper': 'Сделай острее', 'a2.ask.voice': 'Перепиши в голосе профиля', 'a2.ask.ph': 'Что здесь поменять?',
    'a2.reply.sel': 'Вот вариант. Остальной текст не трогал.', 'a2.rejected': 'Отклонено', 'a2.pending': 'предложений ждут',
    'a2.subs': '2 140 подписчиков', 'a2.prevnote': 'Превью приблизительное: шрифты и переносы на площадке могут отличаться.',
    'a2.divider': 'Изменить ширину чата', 'a2.model.default': 'по умолчанию', 'a2.model.all': 'Все модели BB…', 'a2.models': 'Модель',
    'a2.marked': 'Готов', 'a2.stale_hint': 'EN правили после этого RU', 'a2.synced': 'RU твита {n} переписан по новому EN, в голосе профиля.',
  });
  const T = (k) => `<span data-i18n="${k}">${MP.t(k)}</span>`;
  const $ = (id) => document.getElementById(id);
  const POST_VIEWS = ['tg', 'x', 'tgprev', 'narrow'];
  const plat = (v) => (v === 'x' ? 'x' : 'tg');
  let filter = 'all', xlang = 'en', selText = '', stale = D.tweets.map((t) => !!t.stale), ready = false;
  const RU_FIX = { 1: 'Одна страница: три ставки на месяц и почему именно они. Остальное — бэклог, а бэклог ничего не обещает.' };
  const SEL_ANSWERS = { shorter: 'Квартальный роадмап устаревал за три недели.', sharper: 'Квартальный роадмап умирал через три недели.', voice: 'Роадмап на квартал жил три недели — дальше мы двигали карточки, а не продукт.' };

  /* ---------- Profile level (A) ---------- */
  function renderLists() {
    $('a-plat').innerHTML =
      `<button class="mp-nav-item" data-filter="all" aria-selected="${filter === 'all'}"><span class="mp-tile sm">${MP.icons('list')}</span>${T('plat.all')}<span class="n">${D.posts.length}</span></button>` +
      D.platforms.map((p) => `<button class="mp-nav-item" data-filter="${p}" aria-selected="${filter === p}">${MP.tile(p, 'sm')}${T('plat.' + p)}<span class="n">${MP.count(p)}</span></button>`).join('') +
      `<button class="mp-nav-item"><span class="mp-tile sm">${MP.icons('plus')}</span>${T('plat.more')}</button>`;
    const row = (p, sel) => `<button class="mp-nav-item a-post" ${p.go ? `data-go="${p.go}"` : ''} ${p.id === sel ? 'aria-current="page"' : ''}>${MP.tile(p.plat, 'sm')}
        <span class="mp-grow"><span class="t mp-truncate">${p.title}</span><span class="m">${MP.pill(p.status)}<span class="mp-meta">${MP.when(p)}</span></span></span></button>`;
    $('a-posts').innerHTML = D.posts.filter((p) => filter === 'all' || p.plat === filter).map((p) => row(p, '')).join('');
    const cur = MP.view === 'x' ? 'p2' : 'p1';
    $('a2-posts').innerHTML = `<div class="mp-menu-label">${T('post.posts')} · Мой голос</div>` + D.posts.slice(0, 8).map((p) => row(p, cur)).join('');
    $('a-recent').innerHTML = D.posts.slice(0, 6).map((p) =>
      `<div class="a-row" ${p.go ? `data-go="${p.go}" role="button" tabindex="0"` : ''}>${MP.tile(p.plat)}<span class="mp-grow"><span class="mp-truncate" style="display:block;font-weight:500">${p.title}</span><span class="mp-meta mp-truncate" style="display:block">${p.snip}</span></span>
        <span class="mp-meta mp-num" style="white-space:nowrap">${MP.size(p)}</span>${MP.pill(p.status)}</div>`).join('');
    $('a-platcards').innerHTML = D.platforms.map((p) =>
      `<div class="a-platcard">${MP.tile(p, 'lg')}<span class="mp-grow"><span style="display:block;font-weight:500">${T('plat.' + p)}</span><span class="mp-meta">${T('rules.' + p)}</span></span>
        <span class="mp-meta mp-num" style="text-align:right;white-space:nowrap">${['draft', 'ready', 'published'].map((s) => MP.count(p, s) ? `${MP.count(p, s)} ${MP.t('a.c.' + s)}` : '').filter(Boolean).join(' · ')}</span></div>`).join('');
    $('a-sw').innerHTML = MP.switcherHTML('mine');
    $('a-new').innerHTML = MP.pickerHTML();
  }
  document.addEventListener('click', (e) => {
    const f = e.target.closest('[data-filter]');
    if (f) { filter = f.dataset.filter; renderLists(); MP.applyI18n(); }
  });

  /* ---------- Post level ---------- */
  function tweetHTML(i, tw) {
    const half = (lang) => `
      <div class="mp-twin${lang === 'ru' && stale[i] ? ' is-stale' : ''}" data-twin="${i}-${lang}">
        <div class="mp-row" style="margin-bottom:6px;flex-wrap:wrap;row-gap:4px"><span class="mp-pill ${lang === 'en' ? 'mp-pill-neutral' : 'mp-pill-muted'}">${lang.toUpperCase()}</span>
          ${lang === 'ru' ? `<span class="a2-stale-only">${MP.pill('stale')}</span>` : ''}<span class="mp-grow"></span>
          <span class="mp-row" style="gap:6px"><span class="mp-count" id="a2c${i}${lang}"></span><span data-ring-slot="a2r${i}${lang}"></span></span></div>
        <textarea class="mp-tweet-ta" data-tw="${i}" data-lang="${lang}" data-count="280" data-count-out="a2c${i}${lang}" data-ring="a2r${i}${lang}" aria-label="${MP.t('x.tweet')} ${i + 1} ${lang.toUpperCase()}">${tw[lang]}</textarea>
        ${lang === 'ru' ? `<div class="a2-sync-row" style="display:none"><span class="mp-meta mp-grow" data-i18n="a2.stale_hint">${MP.t('a2.stale_hint')}</span><button class="mp-btn sm mp-raised" data-a2-sync="${i}">${MP.icons('refresh')}${T('sug.translate')}</button></div>` : ''}
      </div>`;
    return `<div class="mp-tweet a2-tweet"><div class="mp-row mp-tweet-head"><span class="mp-meta mp-num">${T('x.tweet')} ${i + 1}</span><span class="mp-grow"></span><button class="mp-btn sm icon ghost" aria-label="more">${MP.icons('more')}</button></div><div class="a2-tw-body">${half('en')}${half('ru')}</div></div>`;
  }
  function renderX() {
    $('a2-xprev').innerHTML = [...document.querySelectorAll('#a2-tweets textarea[data-lang="' + xlang + '"]')].map((ta, i, all) => `
      <div class="a2-xcard"><div class="who"><span class="mp-avatar">МГ</span><b style="font-weight:600">Мой голос</b><span class="mp-meta mp-truncate">@bez_filtrov · ${i + 1}/${all.length}</span><span class="mp-grow"></span>${MP.icons('x')}</div>${ta.value.replace(/</g, '&lt;')}</div>`).join('');
  }
  function renderBubble() {
    const doc = $('a2-tg-doc').cloneNode(true);
    doc.querySelectorAll('.mp-hl, .mp-fresh').forEach((s) => s.replaceWith(...s.childNodes));
    $('a2-bubble').innerHTML = [...doc.querySelectorAll('p')].map((p) => `<p>${p.innerHTML}</p>`).join('') + `<div class="ft"><span class="mp-row" style="gap:4px">${MP.icons('eye')}—</span><span>12:40</span></div>`;
  }
  const chatHead = () => `<div class="mp-chat-head"><span class="mp-avatar" style="width:24px;height:24px;font-size:10px">AI</span><span class="mp-h2">${T('chat.copywriter')}</span><span class="mp-meta mp-truncate">· Мой голос</span><span class="mp-grow"></span><button class="mp-btn sm icon ghost" aria-label="more">${MP.icons('more')}</button></div>`;
  function modelMenu() {
    const row = (name, note, on) => `<button class="mp-nav-item" style="min-height:36px" ${on ? 'aria-selected="true"' : ''}><span class="mp-model" style="padding:0"><i></i></span><span class="mp-grow" style="color:var(--foreground)">${name}</span>${note}${on ? MP.icons('check') : ''}</button>`;
    $('a2-model').innerHTML = `<div class="mp-menu-label">${T('a2.models')}</div>` + row('Claude Opus', `<span class="mp-meta">${T('a2.model.default')}</span>`, true) + row('Claude Sonnet', '', false) +
      `<hr class="mp-divider" style="margin:6px 0"><button class="mp-nav-item" style="min-height:36px">${T('a2.model.all')}</button>`;
  }
  function renderOnce() {
    $('a-portrait').innerHTML = MP.portraitHTML('done', { compact: true });
    $('a-ready-pill').innerHTML = MP.pill('ready');
    $('a-build-pill').innerHTML = MP.pill('building');
    $('a-stylechat').innerHTML = MP.chatHTML({ who: 'chat.style_agent', skill: 'style-portrait', log: MP.styleLog(), ph: 'chat.ph_profile' });
    $('a-create').innerHTML = MP.chatHTML({ who: 'chat.style_agent', skill: 'style-portrait', ph: 'chat.ph_profile',
      log: `<details class="mp-panel a-pinned"><summary class="mp-panel-head" style="cursor:pointer;list-style:none"><span data-ico="spark"></span>${T('portrait.title')}<span class="mp-grow"></span>${MP.portraitProgress()}<span data-ico="chev" style="color:var(--muted-foreground)"></span></summary>
        <div class="mp-panel-body"><div class="mp-row"><span class="mp-meta" style="width:46%">${T('portrait.name')}</span><input class="mp-input" value="Мой голос" style="flex:1"></div>
        ${MP.portraitHTML('building', { compact: true })}<div class="mp-row" style="margin-top:12px"><span class="mp-grow"></span><button class="mp-btn mp-accent" disabled>${T('portrait.save')}</button></div></div></details>` + MP.createLog() });
    $('a2-chat-tg').innerHTML = MP.chatHTML({ head: chatHead(), log: MP.tgLog(), chips: ['sug.shorter', 'sug.hooks', 'sug.taboo'] });
    $('a2-chat-x').innerHTML = MP.chatHTML({ head: chatHead(), log: MP.xLog(), chips: ['sug.shorter', 'sug.hooks', 'sug.taboo'] });
    // The x-twins row in the chat does the same as the button in the post.
    document.querySelectorAll('#a2-chat-x [data-say="sug.translate"]').forEach((b) => { b.removeAttribute('onclick'); b.removeAttribute('data-say'); b.dataset.a2Sync = '1'; });
    document.querySelectorAll('.a2-chat .mp-model').forEach((b) => { b.dataset.pop = 'a2-model'; b.setAttribute('aria-haspopup', 'menu'); });
    modelMenu();
    $('a2-tg-doc').innerHTML = MP.tgDocHTML().replace('Роадмап на квартал устаревал через три недели.', '<span class="mp-hl">Роадмап на квартал устаревал через три недели.</span>');
    $('a2-tweets').innerHTML = D.tweets.map((tw, i) => tweetHTML(i, tw)).join('');
  }

  /* Pending proposals -> badge on the Chat tab */
  function updateBadge() {
    const box = document.querySelector(MP.view === 'x' ? '#a2-chat-x' : '#a2-chat-tg');
    const n = box ? box.querySelectorAll('[data-apply]').length + (MP.view === 'x' ? stale.filter(Boolean).length : 0) : 0;
    $('a2-badge').textContent = n ? String(n) : '';
    $('a2-badge').setAttribute('aria-label', `${n} ${MP.t('a2.pending')}`);
  }
  function setPane(p) {
    const w = document.querySelector('.a2-work'); w.dataset.pane = p;
    document.querySelectorAll('.a2-tabs [data-val]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.val === p)));
    if (p === 'post') requestAnimationFrame(placeSel);
    if (p === 'chat') document.querySelectorAll('.a2-chat .mp-chat-log').forEach((l) => { l.scrollTop = l.scrollHeight; });
  }
  function setMode(m) {
    document.querySelector('.a2-post').dataset.mode = m;
    document.querySelectorAll('[data-seg="mode"] [data-val]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.val === m)));
    if (m === 'preview') { renderBubble(); renderX(); } else requestAnimationFrame(placeSel);
  }
  MP.onSeg.pane = (v) => setPane(v);
  MP.onSeg.mode = (v) => setMode(v);
  MP.onSeg.xlang = (v) => { xlang = v; renderX(); };
  const isTabs = () => document.querySelector('.mp-app').clientWidth <= 900;

  /* Selection toolbar: follows the real selection (or the pre-highlighted sentence). */
  function placeSel() {
    const bar = $('a2-sel'), hl = document.querySelector('#a2-tg-doc .mp-hl');
    if (!hl || !hl.offsetParent) { bar.hidden = true; return; }
    bar.hidden = false;
    const host = bar.parentElement.getBoundingClientRect(), r = hl.getClientRects()[0];
    const left = Math.max(0, Math.min(r.left - host.left, host.width - bar.offsetWidth));
    let top = r.top - host.top - bar.offsetHeight - 6;
    if (top < -bar.offsetHeight + 4) top = r.bottom - host.top + 6;
    bar.style.left = left + 'px'; bar.style.top = top + 'px';
    selText = hl.textContent;
  }
  function markSelection() {
    const s = window.getSelection(), doc = $('a2-tg-doc');
    if (!s.rangeCount || s.isCollapsed || !doc.contains(s.anchorNode) || !doc.contains(s.focusNode)) return;
    const range = s.getRangeAt(0);
    doc.querySelectorAll('.mp-hl').forEach((h) => h.replaceWith(...h.childNodes));
    const span = document.createElement('span'); span.className = 'mp-hl';
    try { range.surroundContents(span); } catch (err) { span.textContent = range.toString(); range.deleteContents(); range.insertNode(span); }
    s.removeAllRanges();
    placeSel();
  }
  document.addEventListener('mouseup', (e) => { if (e.target.closest('#a2-tg-doc')) setTimeout(markSelection, 0); });
  document.addEventListener('keyup', (e) => { if (e.shiftKey && e.target.closest('#a2-tg-doc')) markSelection(); });

  function agentMsg(inner) {
    const a = document.createElement('div'); a.className = 'mp-msg mp-msg-agent';
    a.innerHTML = `<span class="mp-avatar">AI</span><div class="mp-msg-body"><div class="mp-msg-who">${T('chat.copywriter')}</div>${inner}</div>`;
    return a;
  }
  function askSelection(kind) {
    const chat = $('a2-chat-tg'), log = chat.querySelector('.mp-chat-log'), ta = chat.querySelector('textarea');
    if (isTabs()) setPane('chat');
    if (kind === 'ask') { ta.value = `«${selText}» — `; ta.placeholder = MP.t('a2.ask.ph'); ta.focus(); return; }
    const u = document.createElement('div'); u.className = 'mp-msg mp-msg-user';
    u.innerHTML = `<span class="a2-quote"></span>${MP.t('a2.ask.' + kind)}`; u.querySelector('.a2-quote').textContent = selText;
    log.appendChild(u);
    const a = agentMsg(MP.tool('writing-in-style', MP.t('a2.ask.' + kind).toLowerCase(), 'running'));
    log.appendChild(a); log.scrollTop = log.scrollHeight;
    setTimeout(() => {
      const id = 'sel-' + Date.now();
      a.querySelector('.mp-msg-body').innerHTML = `<div class="mp-msg-who">${T('chat.copywriter')}</div>${MP.tool('writing-in-style', MP.t('a2.ask.' + kind).toLowerCase(), 'done')}<p>${MP.t('a2.reply.sel')}</p>
        <div class="mp-proposal"><div class="mp-proposal-row"><span class="mp-meta">${T('chat.before')}</span><br><del></del></div>
        <div class="mp-proposal-row"><span class="mp-meta">${T('chat.after')}</span><br><ins>${SEL_ANSWERS[kind]}</ins></div>
        <div class="mp-proposal-actions"><button class="mp-btn sm mp-raised" data-apply="${id}" data-text="${SEL_ANSWERS[kind]}">${MP.icons('check')}${T('chat.apply')}</button><button class="mp-btn sm ghost" data-reject>${T('chat.reject')}</button></div></div>`;
      a.querySelector('del').textContent = selText;
      log.scrollTop = log.scrollHeight; updateBadge();
    }, 900);
  }
  document.addEventListener('click', (e) => {
    const ask = e.target.closest('[data-a2ask]');
    if (ask) { askSelection(ask.dataset.a2ask); return; }
    const rej = e.target.closest('.mp-proposal-actions .mp-btn.ghost');
    if (rej) { rej.closest('.mp-proposal-actions').innerHTML = `<span class="mp-pill mp-pill-muted">${T('a2.rejected')}</span>`; updateBadge(); return; }
    const sync = e.target.closest('[data-a2-sync]');
    if (sync) { syncRu(sync.dataset.a2Sync === '1' && !sync.closest('.mp-twin') ? stale.indexOf(true) : +sync.dataset.a2Sync); return; }
    if (e.target.closest('#a2-ready')) { ready = !ready; paintHead(); return; }
  });
  // Apply: the common runtime marks the card done and calls onApply; selection proposals replace the highlight.
  const baseApply = MP.onApply;
  MP.onApply = (id) => {
    if (String(id).startsWith('sel-')) {
      const hl = document.querySelector('#a2-tg-doc .mp-hl');
      if (hl && SEL_LAST) { hl.className = 'mp-fresh'; hl.textContent = SEL_LAST; }
      MP.refreshCounters(); $('a2-sel').hidden = true;
    } else baseApply(id);
    updateBadge();
  };
  let SEL_LAST = '';
  document.addEventListener('click', (e) => { const b = e.target.closest('[data-apply^="sel-"]'); if (b) SEL_LAST = b.dataset.text; }, true);

  function syncRu(i) {
    if (i < 0 || i == null) return;
    stale[i] = false;
    const twin = document.querySelector(`[data-twin="${i}-ru"]`);
    if (twin) {
      twin.classList.remove('is-stale');
      const ta = twin.querySelector('textarea'); if (RU_FIX[i]) ta.value = RU_FIX[i];
      twin.classList.add('is-fresh'); setTimeout(() => twin.classList.remove('is-fresh'), 1400);
    }
    const log = document.querySelector('#a2-chat-x .mp-chat-log');
    log.appendChild(agentMsg(MP.tool('x-twins', `EN → RU · ${MP.t('x.tweet').toLowerCase()} ${i + 1}`, 'done') + `<p>${MP.t('a2.synced').replace('{n}', i + 1)}</p>`));
    document.querySelectorAll('#a2-chat-x [data-a2-sync="1"]').forEach((b) => { b.disabled = !stale.some(Boolean); });
    log.scrollTop = log.scrollHeight;
    MP.refreshCounters(); renderX(); updateBadge();
  }
  // Editing EN makes its RU twin stale, live.
  document.addEventListener('input', (e) => {
    const ta = e.target.closest('#a2-tweets textarea[data-lang]');
    if (!ta) return;
    const i = +ta.dataset.tw;
    if (ta.dataset.lang === 'en' && !stale[i]) { stale[i] = true; document.querySelector(`[data-twin="${i}-ru"]`).classList.add('is-stale'); document.querySelectorAll('#a2-chat-x [data-a2-sync="1"]').forEach((b) => { b.disabled = false; }); updateBadge(); }
    if (ta.dataset.lang === 'ru' && stale[i]) { stale[i] = false; document.querySelector(`[data-twin="${i}-ru"]`).classList.remove('is-stale'); updateBadge(); }
  });

  function paintHead() {
    const v = MP.view, p = plat(v), title = p === 'x' ? 'Тред: роадмапы против ставок' : 'Почему я перестал делать роадмапы';
    $('a2-tile').innerHTML = MP.tile(p);
    $('a2-platname').textContent = MP.t('plat.' + p);
    $('a2-pill').innerHTML = MP.pill(ready ? 'ready' : p === 'x' ? 'draft' : 'writing');
    $('a2-crumb-plat').innerHTML = `${MP.tile(p, 'sm')}<span class="a2-crumb-plat">${MP.t('plat.' + p)}</span>`;
    $('a2-crumb-plat').dataset.a2filter = p;
    if (document.activeElement !== $('a2-title')) $('a2-title').textContent = title;
    $('a2-crumb-title').textContent = title;
    $('a2-rules').innerHTML = `<span class="mp-rule">${MP.icons(p)}<span data-i18n="rules.${p}">${MP.t('rules.' + p)}</span></span>`;
    $('a2-ready').disabled = ready;
    $('a2-ready').querySelector('[data-i18n]').dataset.i18n = ready ? 'a2.marked' : 'post.mark_ready';
  }
  document.addEventListener('click', (e) => { const c = e.target.closest('[data-a2filter]'); if (c) filter = c.dataset.a2filter; }, true);

  /* Draggable divider between post and chat (pointer + keyboard). */
  (function divider() {
    const d = $('a2-divider'), split = $('a2-split');
    const clamp = (w) => Math.round(Math.max(320, Math.min(w, 640, split.clientWidth - 9 - 480)));
    const set = (w) => { w = clamp(w); split.style.setProperty('--a2-chat-w', w + 'px'); d.setAttribute('aria-valuenow', String(w)); requestAnimationFrame(placeSel); };
    d.addEventListener('pointerdown', (e) => { d.setPointerCapture(e.pointerId); d.classList.add('is-drag'); });
    d.addEventListener('pointermove', (e) => { if (d.classList.contains('is-drag')) set(split.getBoundingClientRect().right - e.clientX - 4); });
    d.addEventListener('pointerup', () => d.classList.remove('is-drag'));
    d.addEventListener('dblclick', () => { split.style.removeProperty('--a2-chat-w'); d.setAttribute('aria-valuenow', '400'); });
    d.addEventListener('keydown', (e) => {
      const cur = $('a2-chat-x').closest('.a2-chat').offsetWidth;
      if (e.key === 'ArrowLeft') { set(cur + 16); e.preventDefault(); }
      if (e.key === 'ArrowRight') { set(cur - 16); e.preventDefault(); }
    });
  })();

  /* State hooks */
  let widthBeforeNarrow = null;
  MP.hooks.push((view) => {
    renderLists();
    const p = view === 'empty' ? null : view === 'create' ? { ini: '?', cls: 'alt', name: MP.t('a.new_profile'), meta: 'status.building' } : D.profiles[0];
    $('a-sw-av').innerHTML = p ? MP.avatar(p) : `<span class="mp-avatar alt">${MP.icons('user')}</span>`;
    $('a-sw-name').textContent = p ? p.name : MP.t('a.no_profile');
    $('a-sw-meta').textContent = p ? MP.t(p.meta) : MP.t('a.pick_profile');
    if (view === 'switcher') MP.openPop('a-sw');
    // Profile level: which tab a narrow pane opens on.
    const lay = document.querySelector('.a-layout'); lay.dataset.apane = view === 'switcher' ? 'rail' : 'centre';
    document.querySelectorAll('.a-tabs [data-val]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.val === lay.dataset.apane)));
    const c = document.querySelector('.a-centre'); if (view === 'home' || view === 'switcher') c.dataset.ctab = c.dataset.ctab || 'overview';
    document.querySelectorAll('[data-seg="ctab"] [data-val]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.val === c.dataset.ctab)));
    if (!POST_VIEWS.includes(view)) return;
    paintHead();
    setMode(view === 'tgprev' ? 'preview' : 'editor');
    setPane(view === 'narrow' ? 'chat' : 'post');
    updateBadge();
  });
  // State 8 shows the narrow pane on the Chat tab; leaving it restores the previous width.
  MP.hooks.push((view) => {
    if (MP.checking) return;
    const cur = document.querySelector('.bb-pane').dataset.w;
    if (view === 'narrow' && cur !== '420') { widthBeforeNarrow = cur; document.querySelector('#proto-w [data-w="420"]')?.click(); }
    else if (view !== 'narrow' && widthBeforeNarrow && cur === '420') { document.querySelector(`#proto-w [data-w="${widthBeforeNarrow}"]`)?.click(); widthBeforeNarrow = null; }
  });
  MP.hooks.push(() => requestAnimationFrame(placeSel));
  new ResizeObserver(() => requestAnimationFrame(placeSel)).observe(document.querySelector('.mp-app'));

  /* Extra self-check for A2: both columns readable, or tabs shown; the selection toolbar inside the card. */
  MP.checks = [(v, out) => {
    if (!POST_VIEWS.includes(v)) return;
    const post = document.querySelector('.a2-post'), chat = document.querySelector('.a2-chat'), tabs = document.querySelector('.a2-tabs');
    const both = post.offsetParent && chat.offsetParent;
    if (both && post.clientWidth < 480) out.push(`${v}: post column ${post.clientWidth}px < 480`);
    if (both && chat.clientWidth < 320) out.push(`${v}: chat column ${chat.clientWidth}px < 320`);
    if (!both && !tabs.offsetParent) out.push(`${v}: one column but no Post | Chat tabs`);
    const sel = $('a2-sel'), card = sel.closest('.a2-edcard');
    if (sel.offsetParent && !sel.hidden) { const r = sel.getBoundingClientRect(), c = card.getBoundingClientRect(); if (r.right > c.right + 1 || r.left < c.left - 1) out.push(`${v}: selection toolbar ${Math.round(r.left)}–${Math.round(r.right)} outside card ${Math.round(c.left)}–${Math.round(c.right)}`); }
    const head = document.querySelector('.a2-bar'); if (head.scrollWidth > head.clientWidth + 1) out.push(`${v}: crumb bar overflows ${head.scrollWidth} > ${head.clientWidth}`);
    const foot = document.querySelector('.a2-post-foot'); if (foot.offsetParent && foot.scrollWidth > foot.clientWidth + 1) out.push(`${v}: post footer overflows ${foot.scrollWidth} > ${foot.clientWidth}`);
    const meta = document.querySelector('.a2-meta-row'); if (meta.offsetParent && meta.getBoundingClientRect().height > 70) out.push(`${v}: post meta row wraps to 3 lines`);
  }];

  renderOnce();
  MP.init({ name: 'A2 · Студия: пост + чат', start: 'tg', views: ['empty', 'switcher', 'create', 'home', 'tg', 'x', 'tgprev', 'narrow'] });
})();
</script>
</body>
